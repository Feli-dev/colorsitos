name: CI

on:
  push:
    branches: [main]
  # No branch filter here on purpose. Pull requests in a chained stack target the
  # previous PR's branch rather than main, so filtering would skip every child PR.
  pull_request:

# Chained pull requests get force-pushed often; superseded runs are wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The repo is at zero warnings, so this keeps it there. It was deliberately
      # absent when CI landed: with nine warnings outstanding the workflow would
      # have arrived red, and a CI that is red on day one teaches everyone to
      # ignore it.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

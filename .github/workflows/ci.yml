name: CI

on:
  push:
    branches: [main]
  # No branch filter here on purpose. Pull requests in a chained stack target the
  # previous PR's branch rather than main, so filtering would skip every child PR.
  pull_request:

# Chained pull requests get force-pushed often; superseded runs are wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No --max-warnings=0: the repo carries pre-existing warnings, and failing
      # on them here would make this workflow red on arrival. Errors still fail.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
